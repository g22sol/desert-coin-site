<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Desert Coin — When the market dries up, the Desert thrives.</title>
<meta name="description" content="Desert Coin (DSRT) — a symbol for bear-market resilience." />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {
  --sand: #F4E3C1;
  --dune1: #B97C50;
  --dune2: #A16B4F;
  --dune3: #8F5C40;
  --sun: #E47A2E;
  --bg: #1a1a1a;
}

body {
  font-family: 'Press Start 2P', monospace;
  background: var(--bg);
  color: #f0e7db;
  margin: 0;
  overflow: hidden;
  cursor: default;
}

.pixel-shadow {
  text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
}

.logo-placeholder {
  width: 120px;
  height: 120px;
  background: linear-gradient(135deg, var(--sun), var(--dune1));
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 700;
  z-index: 5;
  position: relative;
}

/* Multi-layer dunes */
.dune-layer {
  position: absolute;
  width: 200%;
  height: 200%;
  border-radius: 50%;
  opacity: 0.15;
  z-index: 2;
  transition: transform 0.1s;
}

.dune1 { background: linear-gradient(to top, var(--dune1) 0%, var(--bg) 70%); bottom: -50%; left: -50%; }
.dune2 { background: linear-gradient(to top, var(--dune2) 0%, var(--bg) 70%); bottom: -60%; left: -60%; }
.dune3 { background: linear-gradient(to top, var(--dune3) 0%, var(--bg) 70%); bottom: -70%; left: -70%; }

.dune1.animate { animation: drift1 30s linear infinite; }
.dune2.animate { animation: drift2 45s linear infinite; }
.dune3.animate { animation: drift3 60s linear infinite; }

@keyframes drift1 { 0%{transform:translateX(-25%) translateY(0);} 50%{transform:translateX(25%) translateY(-20px);} 100%{transform:translateX(-25%) translateY(0);} }
@keyframes drift2 { 0%{transform:translateX(20%) translateY(0);} 50%{transform:translateX(-20%) translateY(-15px);} 100%{transform:translateX(20%) translateY(0);} }
@keyframes drift3 { 0%{transform:translateX(-15%) translateY(0);} 50%{transform:translateX(15%) translateY(-10px);} 100%{transform:translateX(-15%) translateY(0);} }

/* Sun */
.sun {
  position: absolute;
  bottom: 20%;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, #FFD166 0%, #E47A2E 60%, transparent 80%);
  border-radius: 50%;
  z-index: 1;
  animation: sunset 120s linear infinite alternate;
}

@keyframes sunset {
  0% { transform: translateX(-50%) translateY(0); opacity: 1; }
  100% { transform: translateX(-50%) translateY(50px); opacity: 0.7; }
}
</style>
</head>
<body>

<!-- Sun -->
<div class="sun"></div>

<!-- Multi-layer dunes -->
<div class="dune-layer dune1 animate" id="dune1"></div>
<div class="dune-layer dune2 animate" id="dune2"></div>
<div class="dune-layer dune3 animate" id="dune3"></div>

<div class="min-h-screen flex flex-col items-center justify-center text-center p-6 relative z-10">
  <!-- Logo -->
  <div class="logo-placeholder mb-6">
    <img src="/logo.png" alt="Desert Coin Logo" class="w-28 h-28 object-contain" onerror="this.style.display='none'">DSRT
  </div>

  <!-- Title -->
  <h1 class="text-2xl sm:text-4xl pixel-shadow" style="color: var(--sand)">Desert Coin (DSRT)</h1>
  <p class="mt-4 text-sm text-gray-300 max-w-xl">
    When the market dries up, the Desert thrives.<br>
    Desert Coin is a symbol of strength in bear markets — made for those who keep building through the drought.
  </p>

  <!-- Buy Button -->
  <a id="buyButton" href="https://pump.fun/coin/3fHjxmGeSggFzVZZMfm9vEifjHREdHDTST8Fjh6vpump" target="_blank" class="mt-8 inline-block px-6 py-3 rounded-lg shadow hover:scale-105 transition transform bg-gradient-to-r from-yellow-400 to-orange-500 text-white text-sm">
    Buy Desert Coin
  </a>

  <!-- Footer -->
  <div class="mt-6 text-xs text-gray-500 max-w-md">
    Stay dry. Stay strong. Desert never dies.
  </div>
</div>

<script>
  // Parallax effect on mouse movement
  const dune1 = document.getElementById('dune1');
  const dune2 = document.getElementById('dune2');
  const dune3 = document.getElementById('dune3');

  document.addEventListener('mousemove', e => {
    const x = e.clientX / window.innerWidth - 0.5;
    const y = e.clientY / window.innerHeight - 0.5;

    dune1.style.transform = `translate(${x*30}px, ${y*20}px)`;
    dune2.style.transform = `translate(${x*20}px, ${y*15}px)`;
    dune3.style.transform = `translate(${x*10}px, ${y*10}px)`;
  });
</script>

</body>
</html>
